# This workflow publishes the package to npm when a version tag is pushed
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  npm-publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install
      - run: bun run build
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Determine npm dist-tag
        run: |
          VERSION="${GITHUB_REF_NAME#[vV]}"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_ID="${VERSION#*-}"
            TAG_ID="${TAG_ID%%.*}"
            echo "NPM_TAG=--tag ${TAG_ID}" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=" >> "$GITHUB_ENV"
          fi
      - run: npm publish --access public ${NPM_TAG}
        name: Publish
